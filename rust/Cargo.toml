# lwIP in Rust. See README.md.
[workspace]
members = ["lwip", "third_party/fp", "third_party/rivet"]
# Forkpoint's SDK, vendored as is: its own features are Forkpoint's to test, and
# --all-features here would turn on probes for the host.
exclude = ["third_party/forkpoint-sdk"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "BSD-3-Clause"

# The firmware links the lwip staticlib into an ESP-IDF image, whose panic path is
# abort(): unwinding tables would only take flash.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
debug = true
