[package]
name = "lwip"
description = "lwIP core modules in Rust, linked into the C stack module by module"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

# An rlib for host tests; the firmware build asks for a staticlib with
# `cargo rustc --crate-type staticlib` (see ../cmake/lwip-rust.cmake).
[lib]
path = "src/lib.rs"

[dependencies]
fp = { path = "../third_party/fp" }
rivet-libc = { path = "../third_party/rivet" }

# The Forkpoint SDK, with the forkpoint feature. Firmware probes the hostcall device at
# FPT_HOSTCALL_BASE; a host build only writes the catalog, so its tests run the macros.
[target.'cfg(target_os = "none")'.dependencies]
forkpoint = { package = "lwip-forkpoint-sdk", path = "../third_party/forkpoint-sdk", features = ["enabled"], optional = true }

[target.'cfg(not(target_os = "none"))'.dependencies]
forkpoint = { package = "lwip-forkpoint-sdk", path = "../third_party/forkpoint-sdk", features = ["catalog"], optional = true }

# Report every LWIP_ASSERT to Forkpoint as a property, as the C files do when built with
# LWIP_FORKPOINT (see README.md). The firmware build turns it on with
# LWIP_FORKPOINT_HOSTCALL_BASE.
[features]
forkpoint = ["dep:forkpoint"]

# One feature per ported C file, named after it. The firmware build turns on the ones in
# LWIP_RUST_MODULES and drops those C files.
def = []
inet_chksum = []
ip4_addr = []
mem = []
memp = []
pbuf = []
netif = []
ethernet = []
etharp = []
ip4 = []
ip4_frag = []
icmp = []
udp = []
dns = []
dhcp = []
tcp = []
tcp_in = []
tcp_out = []
timeouts = []
