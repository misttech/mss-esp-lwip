name: rust

on:
  push:
    paths: ["rust/**", "src/**", "test/unit/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "src/**", "test/unit/**", ".github/workflows/rust.yml"]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target riscv32imafc-unknown-none-elf
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked -p lwip --all-features --target riscv32imafc-unknown-none-elf --release

  # lwIP's own unit tests, all C and with the Rust modules, must give the same results.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y check ninja-build
      - run: rustup toolchain install stable --profile minimal
      - run: rust/test/unit/run.sh
